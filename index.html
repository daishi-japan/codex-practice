<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社内AI勉強会 | 告知ページ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

    :root {
      --bg: #0b1224;
      --card: #0f172a;
      --glass: rgba(255, 255, 255, 0.08);
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.18), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(14, 165, 233, 0.18), transparent 35%),
                  var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Noto Sans JP', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 28px;
    }

    header {
      width: min(1100px, 100%);
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(120deg, rgba(14, 165, 233, 0.32), rgba(167, 139, 250, 0.32)),
                  linear-gradient(160deg, rgba(14, 165, 233, 0.24), rgba(34, 197, 94, 0.14));
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    header::before,
    header::after {
      content: '';
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      mix-blend-mode: screen;
      opacity: 0.55;
      filter: saturate(1.1) contrast(1.05);
      z-index: 0;
    }

    header::before {
      background-image: radial-gradient(circle at 20% 40%, rgba(255, 255, 255, 0.16), transparent 30%),
                        radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.12), transparent 38%),
                        linear-gradient(115deg, rgba(14, 165, 233, 0.35), rgba(59, 130, 246, 0.15));
      transform: scale(1.03);
      filter: blur(1px);
    }

    header::after {
      background-image: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1600&q=80');
      opacity: 0.65;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      padding: 54px 56px 80px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      backdrop-filter: blur(4px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 999px;
      width: fit-content;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      color: #f8fafc;
    }

    .eyebrow .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 6px rgba(125, 211, 252, 0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 46px);
      line-height: 1.25;
      letter-spacing: -0.02em;
      text-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    h1 span {
      color: #cffafe;
    }

    .summary {
      max-width: 640px;
      font-size: 17px;
      line-height: 1.7;
      color: var(--muted);
    }

    .cta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.01em;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.3s ease;
      color: #0b1224;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 14px 32px rgba(67, 56, 202, 0.35);
    }

    .btn.secondary {
      color: var(--text);
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    main {
      width: min(1100px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 26px 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      position: relative;
      overflow: hidden;
    }

    main::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 15% 20%, rgba(125, 211, 252, 0.12), transparent 35%),
                  radial-gradient(circle at 85% 30%, rgba(167, 139, 250, 0.12), transparent 35%);
      opacity: 0.8;
      pointer-events: none;
    }

    .info-card {
      position: relative;
      padding: 18px 18px 16px 70px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .info-card .icon {
      position: absolute;
      left: 18px;
      top: 18px;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.18), rgba(167, 139, 250, 0.18));
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: #e0f2fe;
    }

    .info-card h3 {
      margin: 0 0 6px;
      font-size: 17px;
      letter-spacing: 0.01em;
    }

    .info-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    @media (max-width: 720px) {
      body { padding: 16px; }
      .hero-content { padding: 40px 32px 56px; }
      h1 { font-size: clamp(30px, 8vw, 38px); }
      .summary { font-size: 16px; }
      main { padding: 22px; }
      .info-card { padding: 16px 16px 14px 62px; }
      .info-card .icon { width: 38px; height: 38px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hero-content">
      <div class="eyebrow"><span class="dot"></span>AI Learning Day</div>
      <h1><span>社内AI勉強会</span> — 未来をつくるチームのためのアップデート</h1>
      <p class="summary">
        最新の生成AIトレンドと実践的な活用法を、デザイナー・エンジニア・ビジネスの視点から共有する社内限定イベントです。
        業務効率化のヒントからクリエイティブな発想法まで、手触り感のあるワークショップで一緒に体験しましょう。
      </p>
      <div class="cta-row">
        <button class="btn">参加登録する</button>
        <button class="btn secondary">アジェンダを確認</button>
      </div>
    </div>
  </header>

  <main>
    <div class="info-card">
      <div class="icon" aria-hidden="true">🗓️</div>
      <h3>開催日時</h3>
      <p>2024年7月18日 (木) 13:00 - 16:30</p>
    </div>
    <div class="info-card">
      <div class="icon" aria-hidden="true">📍</div>
      <h3>場所</h3>
      <p>本社オフィス 12F Sky Studio<br>オンライン配信 (Teams) 同時開催</p>
    </div>
    <div class="info-card">
      <div class="icon" aria-hidden="true">🎯</div>
      <h3>テーマ</h3>
      <p>生成AIを味方につける業務デザインとプロトタイピング</p>
    </div>
  </main>
</body>
</html>
