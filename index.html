<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社内AI勉強会 | 告知ページ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 上部：画像エリア */
    .hero-image {
      width: 100%;
      height: 500px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      transition: transform 0.3s ease;
    }

    .container:hover .hero-image img {
      transform: scale(1.05);
    }

    .hero-image::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 150px;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.95), transparent);
    }

    /* AI バッジ */
    .ai-badge {
      position: absolute;
      top: 30px;
      left: 30px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #667eea;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ai-badge::before {
      content: '✨';
      font-size: 18px;
    }

    /* 下部：情報カードエリア */
    .info-section {
      padding: 60px 50px;
      background: white;
    }

    .info-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .info-card {
      padding: 32px;
      border-radius: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .info-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .info-card:hover {
      transform: translateX(8px);
      box-shadow: 0 12px 40px rgba(102, 126, 234, 0.25);
    }

    .info-card:hover::before {
      opacity: 1;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #2d3748;
      letter-spacing: -0.3px;
    }

    .card-content {
      font-size: 16px;
      color: #4a5568;
      line-height: 1.6;
      margin-left: 72px;
      font-weight: 500;
    }

    /* タイトルカードは特別なスタイル */
    .info-card.title-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 32px;
    }

    .info-card.title-card::before {
      background: white;
    }

    .info-card.title-card .card-icon {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
    }

    .info-card.title-card .card-title {
      color: white;
      font-size: 20px;
    }

    .info-card.title-card .card-content {
      color: rgba(255, 255, 255, 0.95);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.5px;
    }

    /* レスポンシブ対応 */
    @media (max-width: 768px) {
      .container {
        border-radius: 24px;
      }

      .hero-image {
        height: 350px;
      }

      .ai-badge {
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        font-size: 12px;
      }

      .info-section {
        padding: 40px 24px;
      }

      .info-card {
        padding: 24px;
      }

      .card-icon {
        width: 48px;
        height: 48px;
        font-size: 24px;
      }

      .card-title {
        font-size: 16px;
      }

      .card-content {
        font-size: 14px;
        margin-left: 64px;
      }

      .info-card.title-card .card-content {
        font-size: 22px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .hero-image {
        height: 280px;
      }

      .info-section {
        padding: 32px 20px;
      }

      .card-content {
        margin-left: 0;
        margin-top: 12px;
      }

      .card-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 上部：画像エリア -->
    <div class="hero-image">
      <div class="ai-badge">AI Workshop 2024</div>
      <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=1600&q=85"
           alt="AI勉強会のイメージ画像">
    </div>

    <!-- 下部：情報エリア -->
    <div class="info-section">
      <div class="info-cards">
        <!-- タイトル -->
        <div class="info-card title-card">
          <div class="card-header">
            <div class="card-icon">🎓</div>
            <div class="card-title">イベントタイトル</div>
          </div>
          <div class="card-content">
            社内AI勉強会 2024<br>〜未来を創るための学びの場〜
          </div>
        </div>

        <!-- 開催日時 -->
        <div class="info-card">
          <div class="card-header">
            <div class="card-icon">📅</div>
            <div class="card-title">開催日時</div>
          </div>
          <div class="card-content">
            2024年12月15日（金） 14:00 - 17:00
          </div>
        </div>

        <!-- 場所 -->
        <div class="info-card">
          <div class="card-header">
            <div class="card-icon">📍</div>
            <div class="card-title">場所</div>
          </div>
          <div class="card-content">
            本社オフィス 3階 カンファレンスルームA<br>
            オンライン参加も可能（Zoom配信）
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
